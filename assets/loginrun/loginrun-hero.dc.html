<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LoginRun pixel hero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 810px; overflow: hidden; background: #ffffff; font-family: 'Hanken Grotesk', 'Helvetica Neue', sans-serif;">
<canvas id="lr-canvas" ref="{{setCanvas}}" role="img" aria-label="One-color pixel animation of the LoginRun man running toward a gate and dissolving through it" width="1440" height="810" style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; display: block"></canvas>
<div style="position: absolute; left: 1020px; top: 24px; font-size: 30px; line-height: 1.05; font-weight: 600; letter-spacing: -0.01em; color: {{accent}}">log in</div>
<div style="position: absolute; left: 40px; bottom: 4px; font-size: 30px; line-height: 1; font-weight: 600; letter-spacing: -0.01em; color: {{accent}}">loginrun</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3E96C8","options":["#3E96C8","#1F6FB2","#2E9E6B","#D9552B"]},"speed":{"editor":"range","default":1,"min":0.4,"max":2,"step":0.1},"$preview":{"width":1440,"height":810}}'>
class Component extends DCLogic {
  renderVals() {
    if (!this._setCanvas) {
      this._setCanvas = (el) => {
        if (el) { this.cv = el; this.begin(); } else { this.end(); }
      };
    }
    return { setCanvas: this._setCanvas, accent: this.props.accent ?? '#3E96C8' };
  }

  componentDidMount() { this.begin(); }
  componentWillUnmount() { this.end(); }

  end() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = 0;
  }

  begin() {
    if (this.raf || this.started) return;
    const cv = this.cv || document.getElementById('lr-canvas');
    if (!cv) return;
    this.cv = cv;
    this.started = true;
    const W = 1440, H = 810, C = 10;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = W * dpr; cv.height = H * dpr;
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);

    // The runner, 48 x 56 cells, coverage 0-9, traced from the supplied exit-sign SVG.
    // UP = head, torso and arms (rows 0-28), identical in every frame.
    const UP = '000000000000000000000000000000016998200000000000|000000000000000000000000000000299999940000000000|000000000000000000000000000002999999993000000000|000000000000000000000000000006999999998000000000|000000000000000000000000000008999999999200000000|000000000000000000000000000009999999999200000000|000000000000000000000000000007999999999100000000|000000000000000000000000000005999999997000000000|000000000000000000000000000000899999991000000000|000000000000000000000000000000069999720000000000|000000000000000002222122222220001342000000000000|000000000000000799999999999999985100000000000000|000000000000008999999999999999999960000000000000|000000000000069999999999999999999999200000000000|000000000000399999999999999999999999920000000000|000000000000899999888888999999999999991000000000|000000000004999980000003999999999999998000000000|000000000019999930000008999999999999999400000000|000000000069999800000029999999999999999900000000|000000000199999300000079999999999969999960000000|000000000699996000000299999999999805999993000000|000000000999991000000699999999999200799999999600|000000002999940000001999999999997000189999999990|000000000899700000005999999999992000029999999990|000000000144000000009999999999960000004999999990|000000000000000000049999999999910000000699999600|000000000000000000099999999999600000000000000000|000000000000000000499999999999000000000000000000|000000000000000000799999999999000000000000000000'.split('|');
    // LEGS = rows 29-55 for five leg poses: original, two in-betweens, crossed, wide stride.
    const LEGS = [
      '000000000000000000899999999999400000000000000000|000000000000000000999999999999800000000000000000|000000000000000000999999999999930000000000000000|000000000000000001999998499999970000000000000000|000000000000000002999996099999992000000000000000|000000000000000002999995049999997000000000000000|000000000000000004999994009999999200000000000000|000000000000000005999992004999999600000000000000|000000000000000006999990000999999900000000000000|000000000000000007999990000599999950000000000000|000000000000000008999980000099999990000000000000|000389999999988889999970000059999994000000000000|005999999999999999999950000009999999000000000000|029999999999999999999940000005999999400000000000|089999999999999999999930000000999999800000000000|599999999999999999999900000000599999920000000000|999999999999999999998200000000099999970000000000|000000000000000000000000000000059999992000000000|000000000000000000000000000000009999997000000000|000000000000000000000000000000006999999100000000|000000000000000000000000000000002999999400000000|000000000000000000000000000000000799999900000000|000000000000000000000000000000000299999940000000|000000000000000000000000000000000069999990000000|000000000000000000000000000000000019999994000000|000000000000000000000000000000000006999998000000|000000000000000000000000000000000000478886100000',
      '000000000000000002999999999999400000000000000000|000000000000000002999999998000000000000000000000|000000000000000000899999998000000000000000000000|000000000000000000699999998000000000000000000000|000000000000000000499999998000000000000000000000|000000000000000000199999998000000000000000000000|002787643200000000079999999000000000000000000000|008999999998654210059999999200000000000000000000|039999999999999999879999999500000000000000000000|029999999999999999999999999700000000000000000000|006999999999999999999999999900000000000000000000|000357999999999999999999999920000000000000000000|000000024689999999999999999940000000000000000000|000000000001246899999999999970000000000000000000|000000000000000013579999999990000000000000000000|000000000000000000000399999992000000000000000000|000000000000000000000089999994000000000000000000|000000000000000000000069999997000000000000000000|000000000000000000000039999999000000000000000000|000000000000000000000019999999200000000000000000|000000000000000000000007999999400000000000000000|000000000000000000000004999999600000000000000000|000000000000000000000002999999800000000000000000|000000000000000000000000899999920000000000000000|000000000000000000000000699999940000000000000000|000000000000000000000000399999960000000000000000|000000000000000000000000099999960000000000000000',
      '000000000000000049999999999999400000000000000000|000000000000000069999999999980000000000000000000|000000000000000069999999999980000000000000000000|000000000000000069999999999980000000000000000000|000000000000000069999999999990000000000000000000|000000000000000089999999999990000000000000000000|000168765421000089999999999990000000000000000000|000699999999986589999999999990000000000000000000|000999999999999999999999999990000000000000000000|000899999999999999999999999990000000000000000000|000499999999999999999999999990000000000000000000|000025689999999999999999999990000000000000000000|000000001356899999999999999990000000000000000000|000000000000013599999999999960000000000000000000|000000000000000299999999999810000000000000000000|000000000000000299999991344000000000000000000000|000000000000000399999980000000000000000000000000|000000000000000399999980000000000000000000000000|000000000000000399999960000000000000000000000000|000000000000000499999960000000000000000000000000|000000000000000499999950000000000000000000000000|000000000000000499999940000000000000000000000000|000000000000000599999930000000000000000000000000|000000000000000699999930000000000000000000000000|000000000000000699999920000000000000000000000000|000000000000000699999910000000000000000000000000|000000000000000699999900000000000000000000000000',
      '000000000000000002999999999999000000000000000000|000000000000000006999999999999200000000000000000|000000000000000019999999999999200000000000000000|000000000000000059999996699999300000000000000000|000000000000000099999991499999400000000000000000|000000000000000599999960499999300000000000000000|000000000000000999999910699999200000000000000000|000000000000004999999600799999000000000000000000|000000000000008999999200899998000000000000000000|000000000000039999997000999997000000000000000000|000000000000089999992000999996000000000000000000|000000000049999999998888999995000000000000000000|000000000799999999999999999993000000000000000000|000000004999999999999999999992000000000000000000|000000019999999999999999999991000000000000000000|000000069999999999999999999980000000000000000000|000000099999999999999999999710000000000000000000|000000000099999970000000000000000000000000000000|000000000599999920000000000000000000000000000000|000000000999999800000000000000000000000000000000|000000002999999400000000000000000000000000000000|000000007999999000000000000000000000000000000000|000000029999994000000000000000000000000000000000|000000079999980000000000000000000000000000000000|000000299999930000000000000000000000000000000000|000000799999800000000000000000000000000000000000|000000678875000000000000000000000000000000000000',
      '000000000000000299999999999999400000000000000000|000000000000000799999999999800000000000000000000|000000000000003999999999999950000000000000000000|000000000000008999999999999992000000000000000000|000000000000049999999999999997000000000000000000|000000000000089999999999999999400000000000000000|000000000000599999999389999999810000000000000000|000000000001999999995039999999960000000000000000|000000000006999999980006999999993000000000000000|000000000029999999940000899999998000000000000000|000000000079999999700000299999999500000000000000|000000000499999999200000069999999920000000000000|000000000899999995000000008999999970000000000000|000000004999999980000000002999999994000000000000|000000019999999930000000000599999999100000000000|000000069999999600000000000089999999600000000000|000000299999999100000000000029999999930000000000|000000799999994000000000000005999999980000000000|000003999999980000000000000000799999996000000000|000008999999920000000000000000299999999200000000|000049999999600000000000000000049999999800000000|000089999998100000000000000000007999999940000000|000599999994000000000000000000002999999991000000|000899999970000000000000000000000499999997000000|000899999920000000000000000000000079999999200000|000599999500000000000000000000000019999999300000|000069996000000000000000000000000004999999200000'
    ].map((s) => s.split('|'));
    // one stride: frames 1-5 in order (5 is the wide stride), then it loops straight back to 1
    const SEQ = [0, 1, 2, 3, 4];

    const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const thr = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;
    const hash = (a, b) => (Math.imul(a + 1, 73856093) ^ Math.imul(b + 7, 19349663)) >>> 0;
    const h01 = (a, b) => hash(a, b) / 4294967296;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    const MC = 48;
    const frames = LEGS.map((leg) => {
      const rows = UP.concat(leg);
      const out = [];
      rows.forEach((row, r) => {
        for (let c = 0; c < row.length; c++) {
          const v = +row[c];
          if (v > 0) out.push({ c, r, v: v / 9, th: thr(c, r), h: h01(c, r) });
        }
      });
      return out;
    });

    // Scene layout, in grid cells
    const GX0 = 102, GX1 = 136, GY0 = 8, GY1 = 76, TY = 20;
    const GCX = (GX0 + GX1) / 2, GCY = (GY0 + GY1) / 2;
    const L = 8, T = 6, X_START = -52, X_SPAN = GX1 - X_START;
    const T_ENTER = T * (GX0 - (MC - 1) - X_START) / X_SPAN;

    const streaks = [];
    for (let i = 0; i < 70; i++) {
      streaks.push({
        row: 5 + Math.floor(h01(i, 1) * 70), len: 2 + Math.floor(h01(i, 2) * 6),
        lap: 1 + Math.floor(h01(i, 3) * 3), ph: h01(i, 4)
      });
    }

    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const draw = (tt) => {
      const accent = this.props.accent ?? '#3E96C8';
      g.clearRect(0, 0, W, H);
      g.fillStyle = accent;
      const sq = (x, y, s, w) => {
        const sz = Math.max(1, Math.round(s * (C - 1)));
        const ww = w ? Math.max(sz, Math.round(w * (C - 1))) : sz;
        g.fillRect(Math.round(x * C + (C - 1 - sz) / 2), Math.round(y * C + (C - 1 - sz) / 2), ww, sz);
      };

      const p = clamp(tt / T, 0, 1);
      const X = Math.round(X_START + X_SPAN * p);
      const env = tt < T_ENTER ? 0 : tt < T ? Math.min(1, (tt - T_ENTER) / 0.5) : Math.max(0, 1 - (tt - T) / 1.6);

      // wind streaks rushing toward the gate
      const S = GX0;
      for (const s of streaks) {
        const x0 = ((s.ph * S + s.lap * S * (tt / L)) % S);
        for (let k = 0; k < s.len; k++) {
          const x = Math.floor(x0) - k;
          // wind only trails behind the runner, never ahead of him
          if (x < 0 || x >= S || x >= X + 3) continue;
          const edge = Math.min(x, S - 1 - x, (X + 2 - x) * 1.5) / 6;
          sq(x, s.row, clamp(0.2 + 0.32 * (1 - k / s.len), 0, 0.55) * clamp(edge, 0.25, 1));
        }
      }

      // floor, continuing past the gate
      for (let x = 0; x < GX1 + 14; x += 2) {
        const fade = x > GX1 ? clamp(1 - (x - GX1) / 14, 0, 1) : 1;
        sq(x, GY1, 0.45 * fade);
      }

      // gate frame
      for (let y = GY0; y <= GY1; y++) {
        // one solid bold line, two pixels thick, no gaps
        sq(GX0, y, 1); sq(GX0 + 1, y, 1);
        sq(GX1 - 2, y, 1); sq(GX1 - 1, y, 1);
      }
      for (let x = GX0; x < GX1; x++) {
        sq(x, GY0, 1); sq(x, GY0 + 1, 1);
      }

      // gate interior light, halftone
      for (let iy = GY0 + 3; iy < GY1; iy++) {
        for (let ix = GX0 + 2; ix < GX1 - 2; ix++) {
          const gx = (ix - GX0) / (GX1 - GX0);
          const wave = 0.5 + 0.5 * Math.sin(ix * 0.55 - tt * 9 + iy * 0.12);
          const v = 0.08 + 0.22 * gx + 0.04 * Math.sin(tt * 1.7 + iy * 0.2) + env * (0.3 + 0.4 * wave);
          if (v > thr(ix, iy)) sq(ix, iy, 0.5 + 0.35 * env * wave);
        }
      }

      // the runner: only the legs change pose, the upper body stays as drawn
      const fi = SEQ[Math.floor(tt * 2.3 * SEQ.length) % SEQ.length];
      const cellsNow = frames[fi];
      for (const k of cellsNow) {
        const { c, r } = k;
        const ax = X + c;
        const ay = TY + r;
        if (ax < -2 || ax > GX1 + 2) continue;
        let on;
        // solid body: no holes inside the figure, dithering only on the soft edges
        if (k.v >= 0.85) on = true;
        else on = k.v > k.th;
        if (!on) continue;
        if (ax >= GX0 + 2) {
          const ad = ax - (GX0 + 2);
          // the figure thins out and is cut off cleanly at the gate's right edge
          const edgeX = GX1 - 2;
          const s = 1 - ad / (edgeX - (GX0 + 2));
          const xr = ax + ad * 0.35;
          if (s <= 0.05 || xr >= edgeX - 1) continue;
          const wid = Math.min(s * (1 + ad * 0.12), edgeX - 1 - xr);
          sq(xr, ay, s, k.h < 0.5 ? wid : 0);
        } else {
          sq(ax, ay, 1);
        }
      }

      // success ripple
      const rt = tt - (T - 0.2);
      if (rt > 0 && rt < 2) {
        const rr = rt * 36, fade = 1 - rt / 2;
        const lo = Math.max(0, Math.floor(GCX - rr - 2)), hi = Math.min(143, Math.ceil(GCX + rr + 2));
        for (let y = 0; y < 81; y++) {
          for (let x = lo; x <= hi; x++) {
            const d = Math.hypot(x - GCX, y - GCY);
            const w = Math.abs(d - rr);
            if (w < 1.3 && (1 - w / 1.3) * fade > thr(x, y)) sq(x, y, 0.45);
          }
        }
      }
    };

    if (reduce) {
      draw(3.3);
      return;
    }

    let last = 0, clock = 0;
    const loop = (ts) => {
      if (!last) last = ts;
      const dt = Math.min(0.1, (ts - last) / 1000);
      last = ts;
      clock = (clock + dt * (this.props.speed ?? 1)) % L;
      draw(clock);
      this.raf = requestAnimationFrame(loop);
    };
    this.raf = requestAnimationFrame(loop);
  }
}
</script>
</body>
</html>

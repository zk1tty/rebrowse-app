events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        
        # Handle /rest/v1/* requests by stripping the prefix and forwarding to PostgREST
        location /rest/v1/ {
            rewrite ^/rest/v1/(.*)$ /$1 break;
            proxy_pass http://supabase-postgrest:3000;
            proxy_pass_request_headers on;
        }
        
        # Direct access to PostgREST for testing (without /rest/v1 prefix)
        location / {
            proxy_pass http://supabase-postgrest:3000;
            proxy_pass_request_headers on;
        }
    }
} 
# Simplified PostgreSQL + PostgREST setup for Supabase compatibility
# This provides the core database and REST API functionality

name: supabase

services:
  # PostgreSQL Database
  db:
    container_name: supabase-db
    image: postgres:15
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    command: >
      postgres 
      -c listen_addresses='*'
      -c max_connections=200
      -c shared_preload_libraries=''

  # PostgREST API (Supabase-compatible REST API) - Open mode for demos  
  rest:
    container_name: supabase-postgrest
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    # No external port - accessed through api-gateway
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_DB_USE_LEGACY_GUCS: "false"
      # Use the provided JWT secret for validation
      PGRST_JWT_SECRET: ${JWT_SECRET}

  # Simple API Gateway to handle /rest/v1 prefix like real Supabase
  api-gateway:
    container_name: supabase-rest  # This will be the main entry point
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8001:80"  # External access for testing
    depends_on:
      - rest
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  # Simple Dashboard - Back to normal Docker networking
  adminer:
    container_name: supabase-admin
    image: adminer
    restart: unless-stopped
    ports:
      - "3001:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark

volumes:
  db-data:

networks:
  default:
    name: rebrowse-network 